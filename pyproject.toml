[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "f1-pit-strategy"
version = "1.0.0"
description = "F1 pit strategy prediction with semi-supervised and active learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["joblib>=1.3", "numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.4", "scipy>=1.12"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[project.scripts]
f1-pit-strategy = "f1_pit_strategy.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
line-length = 140
[tool.pytest.ini_options]
testpaths = ["tests"]
